  .headline { font-size:23px; font-weight:700; color:#1A1A1A; line-height:1.4; margin-top:6px; }

  .cat-tile-featured { grid-row:span 2; justify-content:space-between; }
  .cat-tile-featured .cat-icon { width:54px; height:54px; }
  .cat-tile-featured .cat-icon svg { width:26px; height:26px; }
  .cat-tile-featured .cat-title { font-size:17px; }
  .cat-tile-featured .cat-desc { font-size:13px; }

  .cat-desc { font-size:12.5px; color:#6B7280; margin-top:2px; line-height:1.45; flex:1; }

/* ============================================================
   렌더링
   ============================================================ */
function renderHome(){
  document.getElementById('cat-grid').innerHTML = CATEGORIES.map(function(c){
    const action = c.direct ? "openLink('"+c.direct+"')" : "showDetail('"+c.id+"')";
    const tileClass = c.span2 ? 'cat-tile cat-tile-featured' : 'cat-tile';
    return '<button class="'+tileClass+'" onclick="'+action+'">'+
      '<div class="cat-icon" style="background:'+c.bg+'">'+svg(c.icon, c.color)+'</div>'+
      '<div class="cat-title">'+c.title+'</div>'+
      '<div class="cat-desc">'+c.desc+'</div>'+
      '<div class="cat-arrow">'+svg('chevron')+'</div>'+
    '</button>';
  }).join('');

  document.getElementById('shortcut-row').innerHTML = SHORTCUTS.map(function(s){
    return '<div class="shortcut-item" onclick="openLink(\''+s.url+'\')">'+
      '<div class="shortcut-circle" style="background:'+s.color+'">'+svg(s.icon,'#fff')+'</div>'+
      '<div class="shortcut-label">'+s.label+'</div>'+
    '</div>';
  }).join('');
}

function homeFab(){
  return '<button class="home-fab" onclick="showHome()">'+svg('home','#378ADD')+'홈으로</button>';
}

function showDetail(id){
  const c = CATEGORIES.find(function(x){ return x.id === id; });
  if (!c) return;

  const rows = c.items.map(function(it){
    return '<div class="detail-row">'+
      '<div class="detail-row-text">'+
        '<div class="detail-row-title">'+it.t+'</div>'+
        '<div class="detail-row-desc">'+it.d+'</div>'+
      '</div>'+
      '<a class="cta-btn" style="background:'+c.color+'" href="'+it.url+'" target="_blank" rel="noopener noreferrer">바로가기</a>'+
    '</div>';
  }).join('');

  document.getElementById('detail-screen').innerHTML =
    '<div class="detail-header">'+
      '<button class="back-btn" onclick="showHome()">'+svg('back')+'</button>'+
      '<div class="detail-icon" style="background:'+c.color+'">'+svg(c.icon,'#fff')+'</div>'+
      '<div class="detail-title">'+c.title+'</div>'+
    '</div>'+rows+homeFab();

  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('detail-screen').style.display = 'block';
  window.scrollTo(0,0);
}

function showAllServices(){
  let html =
    '<div class="detail-header">'+
      '<button class="back-btn" onclick="showHome()">'+svg('back')+'</button>'+
      '<div class="detail-title">전체 서비스</div>'+
    '</div>';

  CATEGORIES.forEach(function(c, idx){
    html += '<div style="border-top:1px solid #F0F0F0; margin-top:'+(idx===0?'0':'20px')+'; padding-top:'+(idx===0?'0':'16px')+';">'+
      '<div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">'+
        '<div style="width:24px; height:24px; border-radius:50%; background:'+c.color+'; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><span style="display:flex; width:13px; height:13px;">'+svg(c.icon,'#fff')+'</span></div>'+
        '<div style="font-size:13px; font-weight:700; color:'+c.color+';">'+c.title+'</div>'+
      '</div>';
    c.items.forEach(function(it){
      html += '<div class="detail-row">'+
        '<div class="detail-row-text">'+
          '<div class="detail-row-title">'+it.t+'</div>'+
          '<div class="detail-row-desc">'+it.d+'</div>'+
        '</div>'+
        '<a class="cta-btn" style="background:'+c.color+'" href="'+it.url+'" target="_blank" rel="noopener noreferrer">바로가기</a>'+
      '</div>';
    });
    html += '</div>';
  });

  html += homeFab();

  document.getElementById('detail-screen').innerHTML = html;
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('detail-screen').style.display = 'block';
  window.scrollTo(0,0);
}

function showHome(){
  document.getElementById('detail-screen').style.display = 'none';
  document.getElementById('home-screen').style.display = 'block';
  window.scrollTo(0,0);
}

function openLink(url){
  if (url && url !== '#') window.open(url, '_blank', 'noopener,noreferrer');
}

renderHome();
</script>
